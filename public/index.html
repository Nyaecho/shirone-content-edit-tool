<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Shirone 写作台</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./vendor/easymde/easymde.min.css" />
  <link rel="stylesheet" href="./vendor/fontawesome/css/font-awesome.min.css" />
</head>
<body>
  <div id="app"></div>
  <!-- 同步进度条：页面顶端细条，同步时显示百分比 -->
  <div class="sync-progress" id="sync-progress" hidden><div class="sync-progress-bar" id="sync-progress-bar"></div></div>

  <!-- 登录视图 -->
  <template id="tpl-login">
    <div class="login-wrap">
      <form class="login-card" id="login-form">
        <h1 class="login-title">Shirone 写作台</h1>
        <p class="login-sub">内容仓在线写作工具</p>
        <label class="field">
          <span class="field-label">访问密码</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-primary btn-block">进入</button>
        <p class="login-error" id="login-error" hidden></p>
      </form>
    </div>
  </template>

  <!-- 主框架：细图标侧边栏（常驻，原地展开为带文字的覆盖浮层）+ 主内容区 -->
  <template id="tpl-shell">
    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-rail" id="sidebar-rail">
          <button class="rail-btn rail-brand" id="btn-menu" title="展开 / 收起菜单">
            <span class="rail-brand-v">Shirone</span>
            <span class="rail-brand-h"><i class="fa fa-bars"></i><span class="rail-brand-text">Shirone 写作台</span></span>
          </button>
          <button class="rail-btn nav-btn" data-view="posts" title="文章"><i class="fa fa-file-text"></i><span class="rail-label">文章</span></button>
          <button class="rail-btn nav-btn" data-view="moments" title="动态"><i class="fa fa-comment"></i><span class="rail-label">动态</span></button>
          <button class="rail-btn nav-btn" data-view="timeline" title="时间线"><i class="fa fa-clock-o"></i><span class="rail-label">时间线</span></button>
          <span class="badge badge-dev" id="dev-badge" hidden>DEV 下载模式</span>
          <div class="rail-spacer"></div>
          <button class="rail-btn" id="btn-deploy" hidden title="手动拉取站点构建产物（Actions 部署偶发超时失败时的补救）"><i class="fa fa-cloud-download"></i><span class="rail-label">拉取站点</span></button>
          <button class="rail-btn" id="btn-sync" hidden title="从 GitHub 拉取最新内容到本地镜像"><i class="fa fa-refresh"></i><span class="rail-label">同步</span></button>
          <span class="rail-btn health-alert" id="health-alert" hidden title="健康数据链路异常（凭证或同步停滞），详情看服务器日志"><i class="fa fa-heartbeat"></i><span class="rail-label">健康数据异常</span></span>
          <button class="rail-btn" id="btn-logout" title="退出登录"><i class="fa fa-sign-out"></i><span class="rail-label">退出</span></button>
        </div>
        <div class="sidebar-mask" id="sidebar-mask" hidden></div>
      </aside>
      <main class="main" id="main"></main>
    </div>

    <!-- 文章列表 -->
    <template id="tpl-posts">
      <div class="page-head">
        <h2>文章</h2>
        <button class="btn btn-primary" id="btn-new-post">新建文章</button>
      </div>
      <div class="filter-row">
        <input type="search" class="search-input" id="post-search" placeholder="搜索标题 / 标签 / 分类…" />
        <label class="toggle" data-icon="fa-eye-slash"><input type="checkbox" id="post-hide-draft" /><span>隐藏草稿</span></label>
      </div>
      <div class="card-list" id="post-list"></div>
    </template>

    <!-- 动态列表 -->
    <template id="tpl-moments">
      <div class="page-head">
        <h2>动态</h2>
        <button class="btn btn-primary" id="btn-new-moment">发动态</button>
      </div>
      <div class="filter-row">
        <input type="search" class="search-input" id="moment-search" placeholder="搜索内容 / 标签…" />
        <label class="toggle" data-icon="fa-eye-slash"><input type="checkbox" id="moment-hide-draft" /><span>隐藏草稿</span></label>
      </div>
      <div class="card-list" id="moment-list"></div>
    </template>

    <!-- 时间线列表 -->
    <template id="tpl-timeline">
      <div class="page-head">
        <h2>时间线</h2>
        <button class="btn btn-primary" id="btn-new-timeline">新建节点</button>
      </div>
      <div class="filter-row">
        <input type="search" class="search-input" id="timeline-search" placeholder="搜索标题 / 副标题 / 标签…" />
      </div>
      <div class="card-list" id="timeline-list"></div>
    </template>

    <!-- 时间线节点编辑器 -->
    <template id="tpl-timeline-editor">
      <div class="autosave-bar">
        <span class="autosave-status" id="autosave-status-timeline">自动保存未启用</span>
        <span class="autosave-banner" id="autosave-banner-timeline" hidden></span>
      </div>
      <div class="editor-head">
        <button class="btn btn-ghost" id="btn-back"><i class="fa fa-arrow-left"></i> 返回</button>
        <div class="editor-head-actions">
          <button class="btn btn-ghost" id="btn-delete-timeline">删除</button>
          <button class="btn btn-primary" id="btn-save-timeline">保存</button>
        </div>
      </div>
      <div class="timeline-editor card">
        <div class="field-row">
          <label class="field"><span class="field-label">标题 *</span>
            <input type="text" id="te-title" placeholder="如：个人博客初步搭建完成" /></label>
          <label class="field"><span class="field-label">日期 *</span>
            <input type="text" id="te-date" placeholder="如：2026.09 或 2024.09 – 2026.06" /></label>
        </div>
        <div class="field-row">
          <label class="field"><span class="field-label">分类</span>
            <select id="te-category"></select>
            <span class="field-hint">选项来自内容仓 config/timeline.yaml</span></label>
          <label class="field"><span class="field-label">副标题 / 机构 / 角色</span>
            <input type="text" id="te-subtitle" placeholder="如：属于自己的小站正式起步" /></label>
        </div>
        <div class="field-row">
          <label class="field"><span class="field-label">地点</span>
            <input type="text" id="te-location" placeholder="如：Hangzhou, China" /></label>
          <label class="field"><span class="field-label">图标（Iconify 名）</span>
            <input type="text" id="te-icon" placeholder="如：material-symbols:rocket-launch-rounded" /></label>
        </div>
        <label class="field"><span class="field-label">描述</span>
          <textarea id="te-description" rows="3" placeholder="详细描述或背景说明"></textarea></label>
        <label class="field"><span class="field-label">标签</span>
          <input type="text" id="te-tags" placeholder="回车添加" /></label>
        <div class="tag-box" id="te-tag-box"></div>

        <div class="field">
          <span class="field-label">要点 / 关键成就</span>
          <div class="item-rows" id="te-highlights"></div>
          <button type="button" class="btn btn-ghost" id="btn-add-highlight">＋ 添加要点</button>
        </div>

        <div class="field">
          <span class="field-label">关联链接</span>
          <div class="item-rows" id="te-links"></div>
          <button type="button" class="btn btn-ghost" id="btn-add-link">＋ 添加链接</button>
        </div>

        <div class="switch-row">
          <label class="toggle" data-icon="fa-star"><input type="checkbox" id="te-featured" /><span>重点里程碑</span></label>
          <label class="toggle" data-icon="fa-eye-slash"><input type="checkbox" id="te-disabled" /><span>隐藏节点</span></label>
        </div>
      </div>
    </template>

    <!-- 文章编辑器 -->
    <template id="tpl-post-editor">
      <div class="autosave-bar">
        <span class="autosave-status" id="autosave-status-post">自动保存未启用</span>
        <span class="autosave-banner" id="autosave-banner-post" hidden></span>
      </div>
      <div class="editor-head">
        <button class="btn btn-ghost" id="btn-back"><i class="fa fa-arrow-left"></i> 返回</button>
        <div class="editor-head-actions">
          <label class="toggle" data-icon="fa-refresh"><input type="checkbox" id="pe-refresh-updated" /><span>刷新更新时间</span></label>
          <button class="btn btn-ghost" id="btn-delete-post">删除</button>
          <button class="btn btn-primary" id="btn-save-post">保存</button>
        </div>
      </div>
      <div class="editor-grid">
        <section class="editor-meta card">
          <h3>文章信息</h3>
          <label class="field"><span class="field-label">标题 *</span>
            <input type="text" id="pe-title" placeholder="文章标题（支持中文）" /></label>
          <label class="field"><span class="field-label">Slug（URL 标识）*</span>
            <input type="text" id="pe-slug" placeholder="my-post（小写字母-数字-连字符）" />
            <span class="field-hint">只允许小写字母、数字与连字符；新建时从标题自动生成建议值</span></label>
          <div class="field-row">
            <label class="field"><span class="field-label">分类</span>
              <input type="text" id="pe-category" placeholder="如：使用指南（可自定义）" autocomplete="off" />
              <div class="cat-suggest" id="pe-cat-suggest" hidden></div></label>
            <div class="field"><span class="field-label">封面图</span>
              <div class="cover-upload" id="pe-cover-box">
                <button type="button" class="btn btn-ghost cover-btn" id="btn-upload-cover">点击上传</button>
                <input type="file" id="pe-cover-file" accept="image/*" hidden />
                <img class="cover-thumb" id="pe-cover-thumb" alt="封面预览" hidden />
                <span class="cover-hint" id="pe-cover-hint">固定 cover 文件名，重复上传覆盖</span>
              </div>
              <!-- 隐藏字段：实际提交的封面引用（./cover.webp 或外链） -->
              <input type="hidden" id="pe-image" />
            </div>
          </div>
          <label class="field"><span class="field-label">标签</span>
            <input type="text" id="pe-tags" placeholder="回车添加，如：博客、指南" />
            <span class="field-hint">输入后按回车添加，或点击下方已有标签快速复用</span></label>
          <div class="tag-box" id="pe-tag-box"></div>
          <div class="tag-suggest" id="pe-tag-suggest" hidden></div>
          <label class="field"><span class="field-label">摘要</span>
            <textarea id="pe-description" rows="3" placeholder="留空则自动截取正文前段"></textarea></label>
          <div class="switch-row">
            <label class="toggle" data-icon="fa-thumb-tack"><input type="checkbox" id="pe-pinned" /><span>置顶</span></label>
            <label class="toggle" data-icon="fa-pencil"><input type="checkbox" id="pe-draft" /><span>草稿（同步仓库，生产站点隐藏）</span></label>
            <label class="toggle" data-icon="fa-comments"><input type="checkbox" id="pe-comment" checked /><span>开启评论</span></label>
          </div>
          <div class="meta-note" id="pe-meta-note" hidden></div>
        </section>
        <section class="editor-body">
          <div class="upload-bar card">
            <span>拖拽图片到编辑器，或</span>
            <button class="btn btn-ghost" id="btn-upload-image">上传图片</button>
            <input type="file" id="pe-file" accept="image/*" multiple hidden />
            <div class="upload-list" id="pe-upload-list"></div>
          </div>
          <textarea id="pe-md"></textarea>
        </section>
      </div>
    </template>

    <!-- 动态编辑器 -->
    <template id="tpl-moment-editor">
      <div class="autosave-bar">
        <span class="autosave-status" id="autosave-status-moment">自动保存未启用</span>
        <span class="autosave-banner" id="autosave-banner-moment" hidden></span>
      </div>
      <div class="editor-head">
        <button class="btn btn-ghost" id="btn-back"><i class="fa fa-arrow-left"></i> 返回</button>
        <div class="editor-head-actions">
          <button class="btn btn-ghost" id="btn-delete-moment">删除</button>
          <button class="btn btn-primary" id="btn-save-moment">发布</button>
        </div>
      </div>
      <div class="moment-editor card">
        <textarea id="me-md" placeholder="此刻的想法…（支持 Markdown）"></textarea>
        <div class="field-row">
          <div class="field">
            <span class="field-label">心情</span>
            <div class="mood-row" id="me-moods"></div>
          </div>
          <label class="field"><span class="field-label">地点</span>
            <div class="loc-row">
              <input type="text" id="me-location" placeholder="如：北京 · 朝阳" />
              <button type="button" class="btn btn-ghost" id="btn-locate" title="通过浏览器获取当前位置（精确到省）"><i class="fa fa-map-marker"></i> 定位</button>
            </div>
            <span class="field-hint" id="locate-hint">点击定位自动填入；GPS 需授权，拒绝时自动改用 IP 定位</span></label>
          <label class="field"><span class="field-label">标签</span>
            <input type="text" id="me-tags" placeholder="回车添加" />
            <span class="field-hint">回车添加，或点击下方已有标签快速复用</span></label>
        </div>
        <div class="tag-box" id="me-tag-box"></div>
        <div class="tag-suggest" id="me-tag-suggest" hidden></div>
        <div class="field-row">
          <label class="toggle" data-icon="fa-thumb-tack"><input type="checkbox" id="me-pinned" /><span>置顶</span></label>
          <label class="toggle" data-icon="fa-pencil"><input type="checkbox" id="me-draft" /><span>草稿</span></label>
        </div>
        <div class="moment-images">
          <div class="moment-images-head">
            <span class="field-label">图片（九宫格，最多 9 张）</span>
            <button class="btn btn-ghost" id="btn-upload-moment-image">添加图片</button>
            <input type="file" id="me-file" accept="image/*" multiple hidden />
          </div>
          <div class="moment-image-grid" id="me-image-grid"></div>
        </div>
        <div class="upload-list" id="me-upload-list"></div>
      </div>
    </template>
  </template>

  <!-- 通用对话框 -->
  <dialog id="dlg"></dialog>

  <div id="toast-box"></div>

  <script src="./vendor/easymde/easymde.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
